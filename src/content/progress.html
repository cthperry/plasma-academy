<div class="pa-chapter-header">
  <h1>我的進度</h1>
  <div class="pa-chapter-header__meta">

<div class="pa-prose">
  <p>
    這一頁彙整你在本機的學習紀錄:哪些章節完成了、四階結業測驗的成績,
    以及依規則取得的徽章與可列印的結訓證書。
    <strong>所有資料只存在這台瀏覽器的 <code>localStorage</code></strong>——
    沒有帳號、沒有後端、不會送出任何資料。
  </p>
  <div class="pa-note pa-note--intuition">
    <div class="pa-note__title">✅ 徽章條件(docs/08-assessment.md)</div>
    <p>
      通過對應階段的結業測驗即取得該階徽章;
      <strong>「全程完訓」</strong>則要求四階全部通過,而且全站每一章都完成
      (造訪過、學習目標全勾、章末自我檢測 ≥ 60 %)。
    </p>
  </div>
  <div class="pa-note pa-note--warn">
    <div class="pa-note__title">⚠️ 關於證書</div>
    <p>
      本站的徽章與證書由學習者本機產生,<strong>供內部訓練紀錄參考,並非第三方認證</strong>。
      我們不假裝這是有公信力的外部認證。
    </p>
  </div>
</div>
