<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">腔體清潔的物種與排放鏈</title><desc id="desc">Remote source 生成 F 原子，清除沉積後形成揮發產物，末端仍需處理未反應氣體與副產物。 清潔效率、零件消耗與排放不能分開最佳化。</desc>
  <style>.bg{fill:#fff}.panel{fill:#f2f5f8;stroke:#b7c1cc}.line{fill:none;stroke:#0f6fd6;stroke-width:3}.line2{fill:none;stroke:#c02626;stroke-width:3}.axis{stroke:#4a5560;stroke-width:1.5}.title{fill:#1a1f26;font:700 22px system-ui,sans-serif}.label{fill:#1a1f26;font:700 15px system-ui,sans-serif}.small{fill:#4a5560;font:14px system-ui,sans-serif}.note{fill:#4a5560;font:13px system-ui,sans-serif}.accent{fill:#0f6fd6}.success{fill:#1a7f4b}.border{fill:none;stroke:#d9e0e8}@media(prefers-color-scheme:dark){.bg{fill:#161b22}.panel{fill:#0b0e13;stroke:#3d4753}.title,.label{fill:#e6edf3}.small,.note{fill:#9aa7b4}.axis{stroke:#9aa7b4}.line{stroke:#4d9df0}.line2{stroke:#f0685f}.border{stroke:#2a323c}}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="accent"/></marker></defs>
  <rect class="bg" width="760" height="360" rx="8"/><rect class="border" x="1" y="1" width="758" height="358" rx="8"/><text class="title" x="34" y="44">腔體清潔的物種與排放鏈</text><rect class="panel" x="34" y="112" width="158" height="132" rx="6"/><circle class="accent" cx="56" cy="136" r="10"/><text class="small" x="50" y="172"><tspan x="50" y="172">NF₃ remote dissoc</tspan><tspan x="50" y="196">iation</tspan></text><path class="line" d="M192 178 H209" marker-end="url(#arrow)"/><rect class="panel" x="214" y="112" width="158" height="132" rx="6"/><circle class="accent" cx="236" cy="136" r="10"/><text class="small" x="230" y="172"><tspan x="230" y="172">F 傳輸與壁復合</tspan></text><path class="line" d="M372 178 H389" marker-end="url(#arrow)"/><rect class="panel" x="394" y="112" width="158" height="132" rx="6"/><circle class="accent" cx="416" cy="136" r="10"/><text class="small" x="410" y="172"><tspan x="410" y="172">沉積物氟化</tspan></text><path class="line" d="M552 178 H569" marker-end="url(#arrow)"/><rect class="panel" x="574" y="112" width="158" height="132" rx="6"/><circle class="accent" cx="596" cy="136" r="10"/><text class="small" x="590" y="172"><tspan x="590" y="172">副產物 + abatement</tspan></text><text class="note" x="34" y="334">清潔效率、零件消耗與排放不能分開最佳化。</text></svg>