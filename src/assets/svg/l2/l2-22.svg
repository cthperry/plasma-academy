<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">離子—自由基協同</title><desc id="desc">自由基先形成反應層，離子再移除或活化；兩者同時存在時速率可遠高於相加。 協同項是方向性蝕刻的核心，不是兩個獨立速率相加。</desc>
  <style>.bg{fill:#fff}.panel{fill:#f2f5f8;stroke:#b7c1cc}.line{fill:none;stroke:#0f6fd6;stroke-width:3}.line2{fill:none;stroke:#c02626;stroke-width:3}.axis{stroke:#4a5560;stroke-width:1.5}.title{fill:#1a1f26;font:700 22px system-ui,sans-serif}.label{fill:#1a1f26;font:700 15px system-ui,sans-serif}.small{fill:#4a5560;font:14px system-ui,sans-serif}.note{fill:#4a5560;font:13px system-ui,sans-serif}.accent{fill:#0f6fd6}.success{fill:#1a7f4b}.border{fill:none;stroke:#d9e0e8}@media(prefers-color-scheme:dark){.bg{fill:#161b22}.panel{fill:#0b0e13;stroke:#3d4753}.title,.label{fill:#e6edf3}.small,.note{fill:#9aa7b4}.axis{stroke:#9aa7b4}.line{stroke:#4d9df0}.line2{stroke:#f0685f}.border{stroke:#2a323c}}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="accent"/></marker></defs>
  <rect class="bg" width="760" height="360" rx="8"/><rect class="border" x="1" y="1" width="758" height="358" rx="8"/><text class="title" x="34" y="44">離子—自由基協同</text><rect class="panel" x="34" y="92" width="331" height="190" rx="6"/><rect class="accent" x="34" y="92" width="8" height="190"/><text class="label" x="58" y="126">只有自由基 / 只有離子</text><text class="small" x="58" y="164">反應慢</text><text class="small" x="58" y="198">缺少另一條件</text><rect class="panel" x="395" y="92" width="331" height="190" rx="6"/><rect class="success" x="395" y="92" width="8" height="190"/><text class="label" x="419" y="126">自由基 + 離子</text><text class="small" x="419" y="164">表面層持續更新</text><text class="small" x="419" y="198">協同速率高</text><text class="note" x="34" y="334">協同項是方向性蝕刻的核心，不是兩個獨立速率相加。</text></svg>