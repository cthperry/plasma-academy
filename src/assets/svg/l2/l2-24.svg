<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Child–Langmuir 鞘層尺度</title><desc id="desc">電位降增加會拉厚鞘層，離子電流密度或電漿密度增加則使鞘層變薄。 實際 RF 鞘層還包含時間變化與碰撞。</desc>
  <style>.bg{fill:#fff}.panel{fill:#f2f5f8;stroke:#b7c1cc}.line{fill:none;stroke:#0f6fd6;stroke-width:3}.line2{fill:none;stroke:#c02626;stroke-width:3}.axis{stroke:#4a5560;stroke-width:1.5}.title{fill:#1a1f26;font:700 22px system-ui,sans-serif}.label{fill:#1a1f26;font:700 15px system-ui,sans-serif}.small{fill:#4a5560;font:14px system-ui,sans-serif}.note{fill:#4a5560;font:13px system-ui,sans-serif}.accent{fill:#0f6fd6}.success{fill:#1a7f4b}.border{fill:none;stroke:#d9e0e8}@media(prefers-color-scheme:dark){.bg{fill:#161b22}.panel{fill:#0b0e13;stroke:#3d4753}.title,.label{fill:#e6edf3}.small,.note{fill:#9aa7b4}.axis{stroke:#9aa7b4}.line{stroke:#4d9df0}.line2{stroke:#f0685f}.border{stroke:#2a323c}}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="accent"/></marker></defs>
  <rect class="bg" width="760" height="360" rx="8"/><rect class="border" x="1" y="1" width="758" height="358" rx="8"/><text class="title" x="34" y="44">Child–Langmuir 鞘層尺度</text><text class="label" x="34" y="112">Vsheath ↑</text><rect class="panel" x="190" y="88" width="536" height="46" rx="5"/><rect class="accent" x="190" y="88" width="170" height="46" rx="5" opacity="0.35"/><text class="small" x="206" y="107">s ↑</text><text class="small" x="206" y="126">約 V^(3/4)</text><text class="label" x="34" y="176">nₑ / Ji ↑</text><rect class="panel" x="190" y="152" width="536" height="46" rx="5"/><rect class="accent" x="190" y="152" width="275" height="46" rx="5" opacity="0.55"/><text class="small" x="206" y="171">s ↓</text><text class="small" x="206" y="190">更多離子承載電流</text><text class="label" x="34" y="240">離子質量 ↑</text><rect class="panel" x="190" y="216" width="536" height="46" rx="5"/><rect class="accent" x="190" y="216" width="380" height="46" rx="5" opacity="0.75"/><text class="small" x="206" y="235">尺度改變</text><text class="small" x="206" y="254">速度較慢</text><text class="note" x="34" y="334">實際 RF 鞘層還包含時間變化與碰撞。</text></svg>