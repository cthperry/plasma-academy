<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">預鞘層、鞘層與表面</title>
  <desc id="desc">弱預鞘層先推動離子，強鞘層承擔主要電位降並完成加速。 大部分 plasma-to-surface 電位降位於鞘層。</desc>
  <style>
    .bg{fill:#fff}.panel{fill:#f2f5f8;stroke:#b7c1cc}.line{fill:none;stroke:#0f6fd6;stroke-width:3}.muted-line{fill:none;stroke:#8a95a3;stroke-width:2}.axis{stroke:#4a5560;stroke-width:1.5}.title{fill:#1a1f26;font:700 22px system-ui,sans-serif}.label{fill:#1a1f26;font:700 15px system-ui,sans-serif}.small{fill:#4a5560;font:14px system-ui,sans-serif}.note{fill:#4a5560;font:13px system-ui,sans-serif}.accent{fill:#0f6fd6}.success{fill:#1a7f4b}.warning{fill:#8a5500}.border{fill:none;stroke:#d9e0e8}
    @media(prefers-color-scheme:dark){.bg{fill:#161b22}.panel{fill:#0b0e13;stroke:#3d4753}.title,.label{fill:#e6edf3}.small,.note{fill:#9aa7b4}.axis{stroke:#9aa7b4}.line{stroke:#4d9df0}.border{stroke:#2a323c}}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="accent"/></marker></defs>
  <rect class="bg" width="760" height="360" rx="8"/><rect class="border" x="1" y="1" width="758" height="358" rx="8"/>
  <text class="title" x="34" y="44">預鞘層、鞘層與表面</text>
  <text class="label" x="34" y="110">bulk</text><rect class="panel" x="190" y="88" width="536" height="42" rx="5"/><rect class="accent" x="190" y="88" width="180" height="42" rx="5" opacity="0.35"/><text class="small" x="206" y="106">準中性</text><text class="small" x="206" y="124">低電場</text><text class="label" x="34" y="170">presheath</text><rect class="panel" x="190" y="148" width="536" height="42" rx="5"/><rect class="accent" x="190" y="148" width="270" height="42" rx="5" opacity="0.52"/><text class="small" x="206" y="166">離子緩慢加速</text><text class="small" x="206" y="184">弱電場</text><text class="label" x="34" y="230">sheath</text><rect class="panel" x="190" y="208" width="536" height="42" rx="5"/><rect class="accent" x="190" y="208" width="360" height="42" rx="5" opacity="0.69"/><text class="small" x="206" y="226">離子過剩</text><text class="small" x="206" y="244">強電場</text><text class="label" x="34" y="290">surface</text><rect class="panel" x="190" y="268" width="536" height="42" rx="5"/><rect class="accent" x="190" y="268" width="450" height="42" rx="5" opacity="0.86"/><text class="small" x="206" y="286">收集通量</text><text class="small" x="206" y="304">反應</text>
  <text class="note" x="34" y="334">大部分 plasma-to-surface 電位降位於鞘層。</text>
</svg>