  <path d="M105 95 C240 150 410 225 675 260" fill="none" stroke="#2d6fb7" stroke-width="5"/><text x="555" y="245" font-family="system-ui" font-size="14" fill="#2d6fb7">Calibration error</text>
  <path d="M105 105 C235 175 300 238 390 246 C495 245 555 170 675 95" fill="none" stroke="#c34a56" stroke-width="5"/><circle cx="390" cy="246" r="7" fill="#17835b"/><text x="335" y="80" font-family="system-ui" font-size="14" fill="#17633a">Validation release gate</text>
