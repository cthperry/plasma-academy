<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Source-bias 脈衝與底部電荷時序</title><desc id="desc">Source 先開，bias 延後；底部電荷在重疊時上升並在 bias off 後回落，continuous 參考持續累積。</desc>
  <rect width="760" height="360" fill="#f7f9fc"/><text x="24" y="28" font-family="system-ui" font-size="17" fill="#26323d">同一時間軸：phase、sheath 與 bottom charge</text>
  <g stroke="#c4ccd4"><path d="M110 55H725M110 115H725M110 175H725M110 235H725M110 300H725"/></g>
  <text x="18" y="82" font-family="system-ui" font-size="14">Source</text><path d="M110 100V64H330V100H470V64H690V100" fill="none" stroke="#296ac3" stroke-width="4"/>
  <text x="18" y="142" font-family="system-ui" font-size="14">Bias</text><path d="M110 160H185V124H330V160H545V124H690V160" fill="none" stroke="#d45b36" stroke-width="4"/>
  <text x="18" y="202" font-family="system-ui" font-size="14">Sheath</text><path d="M110 220H185L205 184H330L350 220H545L565 184H690" fill="none" stroke="#8b55ad" stroke-width="4"/>
  <text x="18" y="265" font-family="system-ui" font-size="14">Charge</text><path d="M110 288H185C230 286 280 250 330 244C380 262 425 281 470 286H545C590 282 640 248 690 242" fill="none" stroke="#c53d48" stroke-width="4"/>
  <path d="M110 288 C300 255 500 215 690 185" fill="none" stroke="#5d6872" stroke-width="3" stroke-dasharray="8 6"/><text x="525" y="206" font-family="system-ui" font-size="13" fill="#5d6872">continuous</text>
  <text x="345" y="338" font-family="system-ui" font-size="15" fill="#26323d">時間 →</text>
</svg>
